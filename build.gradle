plugins {
    id 'net.fabricmc.fabric-loom' version "$loom_version"
    id 'maven-publish'
    id 'java'
}

version "${mod_version}+${minecraft_version}"
group maven_group

base {
    archivesName = 'rayon-fabric'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { name 'Fabric'; url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"

    // 26.1+: Minecraft is unobfuscated — no mappings, and mod deps are plain implementation.
    implementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"

    api include("com.github.stephengold:Libbulletjme:$libbulletjme_version")
    api include("dev.lazurite:toolbox-fabric:$toolbox_version"), { transitive false }
    api include("dev.lazurite:transporter-fabric:$transporter_version"), { transitive false }
}

processResources {
    inputs.property 'version', version

    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

publishing {
    repositories {
        maven {
            name 'Lazurite'
            url 'https://lazurite.dev/releases'
            credentials(PasswordCredentials)
            authentication {
                register("basic", BasicAuthentication)
            }
        }
    }

    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
